<label class="lu-toggle"
  hx-post="/plook/livre/{{ book_id }}/toggle-lu"
  hx-target="#lu-section"
  hx-swap="innerHTML"
>
  <input type="checkbox" {% if is_read %}checked{% endif %} class="sr-only">
  <span class="lu-checkbox {% if is_read %}active{% endif %}">
    {% if is_read %}&#10003;{% endif %}
  </span>
  <span class="lu-label">Lu</span>
</label>
